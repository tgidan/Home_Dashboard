; Per-directory PHP settings (read by PHP-FPM/CGI; changes apply within user_ini.cache_ttl, default 5 min)

; The dashboard only ever sends GET requests, so PHP never needs to parse a request body.
; This keeps multipart/upload parsing (incl. session upload progress) out of reach entirely.
enable_post_data_reading = Off
session.upload_progress.enabled = Off
